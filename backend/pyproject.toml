[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofix-ai-backend"
version = "0.1.0"
description = "AutoFix AI – autonomous CI/CD repair backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "httpx==0.28.0",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
    "python-dotenv==1.0.1",
    "cryptography==44.0.0",
    "pyjwt==2.10.1",
    "gitpython==3.1.43",
    "docker==7.1.0",
    "patch-ng==1.17.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "anyio==4.7.0",
    "factory-boy==3.3.1",
    "freezegun==1.5.1",
    "respx==0.21.1",
    "locust==2.32.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["S101"]  # allow assert in tests
